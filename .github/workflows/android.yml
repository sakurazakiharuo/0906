name: Build DualKaraoke APK

on:
  push:
    paths:
      - "DualKaraoke/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DualKaraoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DualKaraoke-debug-apk
          path: DualKaraoke/app/build/outputs/apk/debug/*.apk
